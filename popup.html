	<div id="button-container" class="ui-widget button-group page-section">
		<button id="options" type="button" class="ivblock-button" data-i18n="popupOptions"><svg class="ivb-icon" aria-hidden="true"><use href="#icon-settings" xlink:href="#icon-settings"></use></svg> <span data-i18n="popupOptions"></span></button>
		<button id="lockdown" type="button" class="ivblock-button" data-i18n="popupLockdown"><svg class="ivb-icon" aria-hidden="true"><use href="#icon-lock" xlink:href="#icon-lock"></use></svg> <span data-i18n="popupLockdown"></span></button>
		<button id="override" type="button" class="ivblock-button" data-i18n="popupOverride"><svg class="ivb-icon" aria-hidden="true"><use href="#icon-unlock" xlink:href="#icon-unlock"></use></svg> <span data-i18n="popupOverride"></span></button>
		<button id="stats" type="button" class="ivblock-button" data-i18n="popupStatistics"><svg class="ivb-icon" aria-hidden="true"><use href="#icon-stats" xlink:href="#icon-stats"></use></svg> <span data-i18n="popupStatistics"></span></button>
		<button id="addSites" type="button" class="ivblock-button" data-i18n="popupAddSites"><svg class="ivb-icon" aria-hidden="true"><use href="#icon-plus" xlink:href="#icon-plus"></use></svg> <span data-i18n="popupAddSites"></span></button>
		<button id="cancelOverride" type="button" class="ivblock-button" data-i18n="popupCancelOverride"><svg class="ivb-icon" aria-hidden="true"><use href="#icon-x" xlink:href="#icon-x"></use></svg> <span data-i18n="popupCancelOverride"></span></button>

		<button id="onlineSupport" type="button" class="ivblock-button" data-i18n="popupOnlineSupport"><svg class="ivb-icon" aria-hidden="true"><use href="#icon-help" xlink:href="#icon-help"></use></svg> <span data-i18n="popupOnlineSupport"></span></button>
