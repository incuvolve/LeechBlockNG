<!DOCTYPE html>

<html lang="en">

	<head>
		<meta charset="utf-8">
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
		<title>ivBlock Statistics</title>
		<link href="/jquery-ui/jquery-ui.min.css" rel="stylesheet">
		<link href="/jquery-ui/jquery-ui-custom.css" rel="stylesheet">
		<link href="/jquery-ui-overrides.css" rel="stylesheet">
		<link href="/style.css" rel="stylesheet">
		<link href="/components.css" rel="stylesheet">
		<link href="/options.css" rel="stylesheet">
		<link href="/buttons.css" rel="stylesheet">
		<link href="/stats.css" rel="stylesheet">
		<link href="/icons/ivblock32.ico" rel="icon" type="image/x-icon">
		<link href="/icons/ivblock32.ico" rel="shortcut icon" type="image/x-icon">
		<link id="themeLink" rel="stylesheet">
	<link id="jquiThemeLink" rel="stylesheet">
	</head>

	<body>

		<!-- inline SVG sprite -->
		<div id="svg-sprite" style="position:absolute; width:0; height:0; overflow:hidden;" aria-hidden="true">
		<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
		  <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M19.14 12.936a7.5 7.5 0 0 0 0-1.872l2.036-1.58a0.5 0.5 0 0 0 .12-0.637l-1.928-3.34a0.5 0.5 0 0 0-.607-0.22l-2.396.96a7.47 7.47 0 0 0-1.62-.94l-0.36-2.54A0.5 0.5 0 0 0 13.8 2h-3.6a0.5 0.5 0 0 0-.494.42l-0.36 2.54a7.47 7.47 0 0 0-1.62.94l-2.396-.96a0.5 0.5 0 0 0-.607.22L1.7 8.847a0.5 0.5 0 0 0 .12.637l2.036 1.58a7.5 7.5 0 0 0 0 1.872L1.82 14.51a0.5 0.5 0 0 0-.12.637l1.928 3.34c.14.24.44.34.69.24l2.396-.96c.5.38 1.04.69 1.62.94l0.36 2.54a0.5.5 0 0 0 .494.42h3.6a0.5.5 0 0 0 .494-.42l0.36-2.54c.58-.25 1.12-.56 1.62-.94l2.396.96c.25.1.55 0.01.69-.24l1.928-3.34a0.5 0.5 0 0 0-.12-.637l-2.036-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></symbol>
		  <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
		  <symbol id="icon-lock" viewBox="0 0 24 24"><path d="M17 8V7a5 5 0 0 0-10 0v1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1h-2zM9 7a3 3 0 0 1 6 0v1H9V7zM12 13a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></symbol>
		  <symbol id="icon-stats" viewBox="0 0 24 24"><path d="M5 9h3v10H5zM10.5 4h3v15h-3zM16 13h3v6h-3z"/></symbol>
		  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M11 11V6h2v5h5v2h-5v5h-2v-5H6v-2z"/></symbol>
		</svg>
		</div>

		<div id="form-container-options" class="page-section">

			<form id="form" class="ui-widget" style="display: none;">

				<fieldset>
					<legend data-i18n="statsLegend">ivBlock Statistics</legend>
					<div id="stats-container">
						<div id="stats-card-template" class="stats-card">
							<h3 class="block-set-name"></h3>
							<ul class="stats-list">
								<li><strong data-i18n="statsStartTime">Start Date/Time:</strong> <span class="start-time"></span></li>
								<li><strong data-i18n="statsTotalTime">Time Spent Since Start:</strong> <span class="total-time"></span></li>
								<li><strong data-i18n="statsPerWeekTime">Time Spent Per Week:</strong> <span class="per-week-time"></span></li>
								<li><strong data-i18n="statsPerDayTime">Time Spent Per Day:</strong> <span class="per-day-time"></span></li>
								<li><strong data-i18n="statsTimeLeft">Time Left in Limit Period:</strong> <span class="time-left"></span></li>
								<li><strong data-i18n="statsRolloverTime">Rollover Time:</strong> <span class="rollover-time"></span></li>
								<li><strong data-i18n="statsLockdownEndTime">Lockdown End Time:</strong> <span class="ld-end-time"></span></li>
							</ul>
							<button class="restart-button ivblock-button" type="button" data-i18n="statsRestart"><svg class="ivb-icon" aria-hidden="true"><use href="#icon-stats" xlink:href="#icon-stats"></use></svg> <span data-i18n="statsRestart">Restart</span></button>
						</div>
					</div>
					<p class="button-group">
						<button id="restartAll" type="button" class="ivblock-button" data-i18n="statsRestartAll"><svg class="ivb-icon" aria-hidden="true"><use href="#icon-stats" xlink:href="#icon-stats"></use></svg> <span data-i18n="statsRestartAll">Restart All</span></button>
					</p>
				</fieldset>

			</form>

		</div>

		<script src="/jquery-ui/jquery.min.js"></script>
		<script src="/jquery-ui/jquery-ui.min.js"></script>
		<script src="/common.js"></script>
		<script src="/stats.js"></script>

	</body>

</html>
