<!DOCTYPE html>

<html lang="en">

	<head>
		<meta charset="utf-8">
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
		<title>ivBlock Lockdown</title>
		<link href="/jquery-ui/jquery-ui.min.css" rel="stylesheet">
		<link href="/jquery-ui/jquery-ui-custom.css" rel="stylesheet">
		<link href="/jquery-ui-overrides.css" rel="stylesheet">
		<link href="/style.css" rel="stylesheet">
		<link href="/components.css" rel="stylesheet">
		<link href="/options.css" rel="stylesheet">
		<link href="/controls.css" rel="stylesheet">
		<link href="/buttons.css" rel="stylesheet">
		<link href="/icons/ivBlock32.ico" rel="icon" type="image/x-icon">
		<link href="/icons/ivBlock32.ico" rel="shortcut icon" type="image/x-icon">
		<link id="themeLink" rel="stylesheet">
	<link id="jquiThemeLink" rel="stylesheet">
        <link href="/lockdown.css" rel="stylesheet">
	</head>

	<body>

		<!-- inline SVG sprite -->
		<div id="svg-sprite" style="position:absolute; width:0; height:0; overflow:hidden;" aria-hidden="true">
		<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
		  <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M19.14 12.936a7.5 7.5 0 0 0 0-1.872l2.036-1.58a0.5 0.5 0 0 0 .12-0.637l-1.928-3.34a0.5 0.5 0 0 0-.607-0.22l-2.396.96a7.47 7.47 0 0 0-1.62-.94l-0.36-2.54A0.5 0.5 0 0 0 13.8 2h-3.6a0.5 0.5 0 0 0-.494.42l-0.36 2.54a7.47 7.47 0 0 0-1.62.94l-2.396-.96a0.5 0.5 0 0 0-.607.22L1.7 8.847a0.5 0.5 0 0 0 .12.637l2.036 1.58a7.5 7.5 0 0 0 0 1.872L1.82 14.51a0.5 0.5 0 0 0-.12.637l1.928 3.34c.14.24.44.34.69.24l2.396-.96c.5.38 1.04.69 1.62.94l0.36 2.54a0.5.5 0 0 0 .494.42h3.6a0.5.5 0 0 0 .494-.42l0.36-2.54c.58-.25 1.12-.56 1.62-.94l2.396.96c.25.1.55 0.01.69-.24l1.928-3.34a0.5 0.5 0 0 0-.12-.637l-2.036-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></symbol>
		  <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
		  <symbol id="icon-lock" viewBox="0 0 24 24"><path d="M17 8V7a5 5 0 0 0-10 0v1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1h-2zM9 7a3 3 0 0 1 6 0v1H9V7zM12 13a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></symbol>
		  <symbol id="icon-stats" viewBox="0 0 24 24"><path d="M5 9h3v10H5zM10.5 4h3v15h-3zM16 13h3v6h-3z"/></symbol>
		  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M11 11V6h2v5h5v2h-5v5h-2v-5H6v-2z"/></symbol>
		</svg>
		</div>

		<div id="form-container-options" class="page-section">

			<form id="form" class="ui-widget" style="display: none;" action="javascript: void(0);">

				<fieldset>
					<legend data-i18n="lockdownLegend">ivBlock Lockdown</legend>
					<p>
						<label data-i18n="lockdownDurationLabel">Enter the duration of the lockdown:</label>
					</p>
					<p class="inline-control-row">
						<input id="hours" type="text" size="3" list="hours-list" class="input-short">
						<datalist id="hours-list">
							<option value="1">
							<option value="2">
							<option value="3">
							<option value="4">
							<option value="5">
							<option value="6">
							<option value="12">
							<option value="18">
							<option value="24">
						</datalist>
						<label for="hours" data-i18n="lockdownHoursLabel">hour(s)</label>
						<input id="mins" type="text" size="3" list="mins-list" class="input-short">
						<datalist id="mins-list">
							<option value="5">
							<option value="10">
							<option value="15">
							<option value="20">
							<option value="25">
							<option value="30">
							<option value="35">
							<option value="40">
							<option value="45">
							<option value="50">
							<option value="55">
						</datalist>
						<label for="mins" data-i18n="lockdownMinsLabel">minute(s)</label>
					</p>
					<hr>
					<p>
						<label data-i18n="lockdownSitesLabel">Select the sites to block during the lockdown:</label><br>
						<div id="blockSets">
							<p>
								<input id="blockSet1" type="checkbox">
								<label id="blockSetLabel1" for="blockSet1">Sites specified in Block Set 1</label>
							</p>
						</div>
					</p>
				</fieldset>

				<p class="button-group">
					<button id="activate" type="submit" class="ivblock-button" data-i18n="lockdownActivateButton"><svg class="ivb-icon" aria-hidden="true"><use href="#icon-lock" xlink:href="#icon-lock"></use></svg> <span data-i18n="lockdownActivateButton">Activate Lockdown</span></button>
					<button id="cancel" type="button" class="ivblock-button" data-i18n="buttonCancel"><span data-i18n="buttonCancel">Cancel</span></button>
				</p>

			</form>

		</div>

		<div id="alerts" style="display: none;">
			<div id="alertRetrieveError" title="ivBlock Lockdown">
				<p data-i18n-html="alertRetrieveErrorHtml"><strong>Error:</strong> Unable to retrieve options from browser storage.</p>
			</div>
			<div id="alertNoDuration" title="ivBlock Lockdown">
				<p data-i18n="lockdownAlertNoDuration">Please enter a non-zero duration for the lockdown.</p>
			</div>
			<div id="alertNoSets" title="ivBlock Lockdown">
				<p data-i18n="lockdownAlertNoSets">Please select the sites to lockdown.</p>
			</div>
		</div>

		<script src="/jquery-ui/jquery.min.js"></script>
		<script src="/jquery-ui/jquery-ui.min.js"></script>
		<script src="/common.js"></script>
		<script src="/lockdown.js"></script>

	</body>

</html>
