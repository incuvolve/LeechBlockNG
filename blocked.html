<!DOCTYPE html>

<html id="ivbBlockingPage" lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title data-i18n="blockedPageTitle">Site Blocked</title>
	<link rel="shortcut icon" href="/icons/ivblock32.ico" type="image/x-icon">
	<link rel="icon" href="/icons/ivblock32.ico" type="image/x-icon">
	<link rel="stylesheet" href="/fonts.css" type="text/css">
	<link rel="stylesheet" href="/style.css" type="text/css">
	<link id="themeLink" rel="stylesheet">
	<style id="customStyle"></style>
</head>

<body>

	<!-- logo -->
	<div id="ivbLogoDiv">
		<a href="https://www.incuvolve.de/ivblock/"><picture>
				<source srcset="/images/ivblock_logo_dark_mode.png" media="(prefers-color-scheme: dark)">
				<img id="ivbLogoImg" src="/images/ivblock_logo.png" class="logo"
						alt="ivBlock logo" title="ivBlock">
			</picture></a>
	</div>

	<!-- warning message -->
	<div id="ivbWarningMsgDiv">
		<h1 data-i18n-html="blockedWarning"></h1>
	</div>

	<!-- blocked site info -->
	<div id="ivbBlockedDiv">
		<a id="ivbBlockedURLLink" target="_self"><span id="ivbBlockedURL"></span></a>
		(<span id="ivbBlockedSet" data-i18n="blockedSetLabel"></span>)
		<p id="ivbKeywordMatched" style="display: none;"><span data-i18n="blockedKeywordMatched"></span> <span id="ivbKeywordMatch" class="keyword"></span></p>
		<p id="ivbUnblockText"><span data-i18n="blockedUnblockAt"></span> <span id="ivbUnblockTime" class="time" data-i18n="blockedEndOfTime"></span></p>
	</div>

	<!-- custom message (optional) -->
	<div id="ivbCustomMsgDiv" style="display: none;">
		<p data-i18n="blockedCustomMsgLabel"></p>
		<blockquote id="ivbCustomMsg"></blockquote>
	</div>

	<!-- support info -->
	<div id="ivbSupportDiv" class="support" data-i18n-html="blockedSupportHtml"></div>

	<script src="/common.js"></script>
	<script src="/blocked.js"></script>

</body>

</html>
